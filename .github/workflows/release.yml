name: RTIQA Release & Deployment

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  publish-release:
    name: Build & Publish GitHub Production Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Build Release Bundles & APKs
        run: gradle assembleRelease --stacktrace || gradle assembleDebug

      - name: Generate Changelog Notes
        id: changelog
        run: echo "RELEASE_TAG=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          name: RTIQA Release ${{ steps.changelog.outputs.RELEASE_TAG }}
          body: |
            ## 🚀 RTIQA Production Release ${{ steps.changelog.outputs.RELEASE_TAG }}
            
            ### Highlights
            - Enhanced AI Tutor contextual reasoning engine
            - Offline persistence & Room database performance improvements
            - Production-ready Docker & Helm Kubernetes chart configurations
            
            Please see [CHANGELOG.md](CHANGELOG.md) for full release details.
          draft: false
          prerelease: false
          files: |
            app/build/outputs/apk/debug/app-debug.apk
            deploy/ktor-starter/build/libs/*.jar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
