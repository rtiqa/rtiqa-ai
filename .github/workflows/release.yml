name: RTIQA Release & Deployment

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  publish-release:
    name: Build & Publish GitHub Production Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Verify and Inject Secrets
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -z "$STORE_PASSWORD" ] || [ -z "$KEY_PASSWORD" ] || [ -z "$ANDROID_KEYSTORE_BASE64" ] || [ -z "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "Error: Production signing or Firebase secrets are missing."
            echo "Configure STORE_PASSWORD, KEY_PASSWORD, ANDROID_KEYSTORE_BASE64, and GOOGLE_SERVICES_JSON_BASE64 in GitHub Secrets."
            exit 1
          fi
          echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > app/google-services.json
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > ${RUNNER_TEMP}/rtiqa-release.keystore

      - name: Build Release Bundles & APKs
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEYSTORE_PATH: ${{ runner.temp }}/rtiqa-release.keystore
        run: bash ./gradlew assembleRelease --stacktrace

      - name: Generate Changelog Notes
        id: changelog
        run: echo "RELEASE_TAG=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          name: RTIQA Release ${{ steps.changelog.outputs.RELEASE_TAG }}
          body: |
            ## 🚀 RTIQA Production Release ${{ steps.changelog.outputs.RELEASE_TAG }}
            
            ### Highlights
            - Enhanced AI Tutor contextual reasoning engine
            - Offline persistence & Room database performance improvements
            - Production-ready Docker & Helm Kubernetes chart configurations
            
            Please see [CHANGELOG.md](CHANGELOG.md) for full release details.
          draft: false
          prerelease: false
          files: |
            app/build/outputs/apk/release/*.apk
            deploy/ktor-starter/build/libs/*.jar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Cleanup Secrets
        if: always()
        run: |
          rm -f app/google-services.json
          rm -f ${RUNNER_TEMP}/rtiqa-release.keystore
