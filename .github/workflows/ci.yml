name: RTIQA Continuous Integration (CI)

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  android-build-and-test:
    name: Build Android APK & Run Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Inject Google Services JSON
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "Error: GOOGLE_SERVICES_JSON_BASE64 secret is missing."
            exit 1
          fi
          echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > app/google-services.json

      - name: Validate Gradle Wrapper & Environment
        run: chmod +x gradlew scripts/bootstrap.sh && ./scripts/bootstrap.sh

      - name: Run JVM Unit Tests
        run: bash ./gradlew testDebugUnitTest --stacktrace

      - name: Build Debug APK
        run: bash ./gradlew assembleDebug --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: rtiqa-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

      - name: Cleanup Google Services JSON
        if: always()
        run: rm -f app/google-services.json

  backend-build:
    name: Build Ktor Backend Service
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Build Ktor Microservice Gateway
        run: bash ./gradlew -p deploy/ktor-starter build --stacktrace
