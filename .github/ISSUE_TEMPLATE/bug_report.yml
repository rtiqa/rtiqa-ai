name: 🐛 Bug Report
description: Create a report to help us fix a bug or unexpected crash in RTIQA
title: "[BUG]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: Thank you for reporting a bug! Please fill out the details below to help us investigate and resolve it efficiently.
  - type: textarea
    id: bug-description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
      placeholder: Describe what happened...
    validations:
      required: true
  - type: textarea
    id: reproduction-steps
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the behavior.
      placeholder: |
        1. Go to '...'
        2. Click on '....'
        3. Scroll down to '....'
        4. See error
    validations:
      required: true
  - type: textarea
    id: expected-behavior
    attributes:
      label: Expected Behavior
      description: A clear and concise description of what you expected to happen.
    validations:
      required: true
  - type: textarea
    id: stack-trace
    attributes:
      label: Stack Trace / Logcat Output
      description: Paste any relevant Logcat stack traces or crash logs here.
      render: text
  - type: input
    id: device-info
    attributes:
      label: Device & OS Information
      description: e.g. Samsung Galaxy S23, Android 14 (API 34) or Android Emulator
      placeholder: Device model & Android version
    validations:
      required: false
