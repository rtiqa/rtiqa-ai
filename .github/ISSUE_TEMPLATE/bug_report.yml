name: "🐛 Bug Report"
description: "File a bug report to help us improve RTIQA"
title: "[BUG]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report!
  - type: input
    id: environment
    attributes:
      label: "Device / Environment"
      description: "e.g., Pixel 8 Pro, Android 14 (API 34), Emulator"
      placeholder: "e.g., Samsung Galaxy S23, Android 13"
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: "Bug Description"
      description: "A clear and concise description of what the bug is."
      placeholder: "Describe what happens..."
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: "Steps to Reproduce"
      description: "Steps to reproduce the behavior:"
      placeholder: |
        1. Open the app
        2. Navigate to 'Courses'
        3. Tap on 'AI Tutor'
        4. Observe crash
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: "Expected Behavior"
      description: "What did you expect to happen?"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: "Logcat / Terminal Output"
      description: "Please attach relevant logs or stack traces if available."
      render: shell
