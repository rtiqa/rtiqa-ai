name: "💡 Feature Request"
description: "Suggest an idea or improvement for RTIQA"
title: "[FEAT]: "
labels: ["enhancement", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for suggesting a feature for RTIQA!
  - type: textarea
    id: problem
    attributes:
      label: "Problem Statement / User Need"
      description: "Is your feature request related to a problem or limitation?"
      placeholder: "I'm always frustrated when..."
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: "Proposed Solution"
      description: "Describe the solution or feature you'd like to see added."
      placeholder: "Add a button/view that allows..."
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: "Alternatives Considered"
      description: "Describe any alternative solutions or features you've considered."
  - type: dropdown
    id: component
    attributes:
      label: "Target Component / Module"
      options:
        - "Android App (:app)"
        - "AI Tutor Engine (:feature-ai / core-ai)"
        - "Course & Lesson Engine (:feature-courses)"
        - "Offline Persistence (:core-database)"
        - "Backend Gateway (deploy/ktor-starter)"
        - "Docker Infrastructure (docker/)"
        - "Helm Kubernetes Charts (helm/)"
    validations:
      required: true
